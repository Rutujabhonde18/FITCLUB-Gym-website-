# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy Static Website to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload website files
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: .
          include-hidden-files: true
          exclude: |
            .git/**
            .github/**

      - name: Download website files
        uses: actions/download-artifact@v4
        with:
          name: website
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB1041B58C064CF2BFB8B44302673B70 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_20ABFB366232451EB57DA5E8F2C77DAB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_37A229823CB64A13B3D483A430736D58 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: my-practice-website
          slot-name: Production
          package: .

          
